[project]
authors = ["timoverlaan <t.verlaan@tudelft.nl>"]
channels = ["conda-forge"]
description = "Reproducible environment for processing the ROSMAP dataset"
name = "rosmap-processing"
platforms = ["win-64", "linux-64"]
version = "0.3.0"

[system-requirements]
linux = "3.10"  # Lower for older kernel on DAIC
# cuda = "12.4"  # (not necessary for processing)

[tasks]
# This task will be available but not run automatically
setup-dev = "pip install -e ."

[dependencies]
ipykernel = "*"
psutil = ">=5.9.8,<5.10.dev0"
pandas = ">=2.2.3,<3"

r-base = ">=4.2"
r-seurat = "*"
r-hdf5r = "*"
r-reticulate = "*"
r-remotes = "*"

anndata = ">=0.11.4,<0.12"
seaborn = ">=0.13.2,<0.14"
scanpy = ">=1.11.2,<2"
python-igraph = ">=0.11.8,<0.12"
leidenalg = ">=0.10.2,<0.11"
openpyxl = ">=3.1.5,<4"
pyyaml = ">=6.0,<7"
pyarrow = ">=15"

[pypi-dependencies]
synapseclient = ">=4.7.0"
awscli = ">=1.40.33, <2"
pytest = ">=7.0"
pytest-cov = ">=4.0"

[target.linux-64.dependencies]
scikit-misc = ">=0.1.4,<0.2"  # Apparently not available on windows

# scVI / scANVI on DAIC's GPUs (pipeline scvi-integration): `pixi run -e gpu ...`.
# Linux only, and without the default feature (its PyPI tools conflict with
# PyTorch's protobuf); the default environment is unchanged.
[feature.gpu]
platforms = ["linux-64"]

[feature.gpu.system-requirements]
cuda = "12"

[feature.gpu.dependencies]
pytorch-gpu = "*"
scvi-tools = ">=1.3"
anndata = ">=0.11.4,<0.12"
pandas = ">=2.2.3,<3"
scanpy = ">=1.11.2,<2"
scikit-misc = ">=0.1.4,<0.2"
umap-learn = "*"
matplotlib-base = "*"
pyyaml = ">=6.0,<7"
pyarrow = ">=15"
# as in the default environment: anndata 0.11 reads backed sparse matrices
# with scipy < 1.16 only
scipy = "1.15.*"
h5py = "3.14.*"
pytest = "*"

[environments]
gpu = { features = ["gpu"], no-default-feature = true }
