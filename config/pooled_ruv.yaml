# Pooled pseudobulk with RUV-III next to the other corrections
# (pipelines/pooled_pseudobulk.py), on the pseudobulk of
# config/pooled_pseudobulk.yaml (read, never written):
#   sbatch slurm/pooled_pseudobulk.sh config/pooled_ruv.yaml   # [--overwrite]
# The settings other than the ruv ones are those of config/pooled_pseudobulk.yaml.
# First run (job 158842, data/v2/pooled_ruv): k up to 24, controls chosen by
# replicate top-1 too; see ruv_method_controls.
output_dir: data/v2/pooled_ruv_2
pseudobulk: data/v2/pooled_pseudobulk/pseudobulk.h5ad
donor_table: data/v2/donors/donor_table.tsv
min_cells: 10          # nuclei per donor x cell type for a sample
min_cpm: 1.0           # genes: mean CPM at least this in every dataset
min_pairs: 5           # persons in both datasets for the replicate metrics
protect: [sex, age_capped, dementia]
disease: dementia
disease_positive: "yes"
disease_adjust: [sex, age_capped]
batch_split:
  psychad: brain_bank
umap: true
umap_methods: [none, regress, anchor, ruv]   # rows of umap/<cell type>.png

# RUV-III: k chosen per cell type by cross-fitted replicate top-1
# (ruv_scan.tsv has the curve). In the first run top-1 still rose at k = 24,
# the largest k tried, in every cell type; 32 and 48 show where it levels off.
ruv_k: [1, 2, 4, 8, 12, 16, 24, 32, 48]
ruv_controls: [empirical, all]   # empirical: the half of the genes least associated with dementia
# Method ruv uses the empirical controls; all genes stay in the scan for
# comparison. In the first run, all genes gained at most 0.02 cross-fitted
# top-1, but at k = 24 the t of dementia correlated 0.77 with the reference
# (0.64 in Inh and Oli), vs 0.97 with the empirical controls (mean over cell types).
ruv_method_controls: empirical
ruv_control_share: 0.5
ruv_tolerance: 0.005
# Pseudo-replicates for the batches without bridges (SEA-AD, PsychAD's Mount
# Sinai and NIMH HBCC): per batch, the mean of the samples of one dementia x
# sex x age band (<70, 70-79, 80-89, 90+) group, at least 3
ruv_prps_by: [dementia, sex, age_capped]
ruv_prps_bands: [70, 80, 90]
ruv_prps_min: 3
ruv_prps_weighted: true

datasets:
  rosmap_mit:
    counts: data/v2/counts/ROSMAP_MIT/combined.h5ad
    gene_map: data/v2/reference/rosmap_mit_gene_map.tsv
    donor: projid
    celltype:
      - {column: source_file, match: "Excitatory", label: Exc}
      - {column: source_file, match: "Inhibitory", label: Inh}
      - {column: source_file, match: "Astrocytes", label: Ast}
      - {column: source_file, match: "Oligodendrocytes", label: Oli}
      - {column: source_file, match: "OPCs", label: OPC}
      # Microglia only: the immune file also holds T cells and CAMs
      - {column: cell_type_high_resolution, match: "^Mic", label: Mic}
  rosmap_green:
    counts: data/v2/counts/ROSMAP/combined.h5ad
    gene_map: data/v2/reference/rosmap_green_gene_map.tsv
    donor: individualID
    celltype:
      - {column: source_file, match: "cux2", label: Exc}
      - {column: source_file, match: "/inhibitory", label: Inh}
      - {column: source_file, match: "/astrocytes", label: Ast}
      - {column: state, match: "^OPC", label: OPC}
      - {column: subset, match: "OPC|precursor", label: OPC}
      - {column: source_file, match: "oligodendroglia", label: Oli}
      - {column: source_file, match: "microglia", label: Mic}
      - {column: source_file, match: "vascular", label: Vasc}
  seaad:
    counts:
      - data/v2/counts/SeaAD/SEAAD_A9_RNAseq_final-nuclei.2024-02-13.h5ad
      - data/seaAD/PFC/RNAseq/SEAAD_A9_RNAseq_final-nuclei.2024-02-13.h5ad
    layer: UMIs
    gene_map: data/v2/reference/seaad_gene_map.tsv
    donor: Donor ID
    celltype:
      - {column: Subclass, match: "^L[0-9]", label: Exc}
      - {column: Subclass, match: "^(Lamp5|Pax6|Sncg|Vip|Pvalb|Sst|Chandelier)", label: Inh}
      - {column: Subclass, match: "^Astro", label: Ast}
      - {column: Subclass, match: "^Oligo", label: Oli}
      - {column: Subclass, match: "^OPC", label: OPC}
      - {column: Subclass, match: "^Micro", label: Mic}
      - {column: Subclass, match: "^(Endo|VLMC)", label: Vasc}
  diverse_cohorts:
    counts: data/v2/counts/DiverseCohorts/combined.h5ad
    gene_map: data/v2/reference/diverse_cohorts_gene_map.tsv
    donor: individualID
    celltype:
      - {column: broadcellclass, match: "^Glut", label: Exc}
      - {column: broadcellclass, match: "^Gaba", label: Inh}
      - {column: broadcellclass, match: "^Astro", label: Ast}
      - {column: broadcellclass, match: "^Olig", label: Oli}
      - {column: broadcellclass, match: "^Opc", label: OPC}
      - {column: broadcellclass, match: "^Micro", label: Mic}
      - {column: broadcellclass, match: "^Endo", label: Vasc}
  psychad:
    counts: data/v2/counts/PsychAD/combined.h5ad
    gene_map: data/v2/reference/psychad_gene_map.tsv
    donor: individualID
    celltype:
      - {column: class, match: "^EN$", label: Exc}
      - {column: class, match: "^IN$", label: Inh}
      - {column: class, match: "^Astro$", label: Ast}
      - {column: class, match: "^Oligo$", label: Oli}
      - {column: class, match: "^OPC$", label: OPC}
      - {column: subclass, match: "^Micro$", label: Mic}
      - {column: class, match: "^(Endo|Mural)$", label: Vasc}
