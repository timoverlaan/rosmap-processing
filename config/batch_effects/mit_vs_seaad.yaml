# Dataset effect ROSMAP-MIT vs SeaAD (different donors), within broad cell
# types, on the gene sets of the MIT/SeaAD pairs (identical genes by Ensembl ID).
#   sbatch slurm/batch_effects.sh config/batch_effects/mit_vs_seaad.yaml
# Covariates are recoded to shared labels; values outside a recode map count
# as missing (the log counts the donors with a value). PMI is left out: in
# SeaAD it is stored as a category.
output_dir: data/v2/batch_effects/mit_vs_seaad
max_cells_per_donor: 300
# Disease signal (disease.tsv): dementia within each dataset, and transfer
# of a dementia classifier from one to the other
disease_adjust: [sex, age]

datasets:
  rosmap_mit:
    counts: data/v2/counts/ROSMAP_MIT/combined.h5ad
    gene_map: data/v2/reference/rosmap_mit_gene_map.tsv
    donor: projid
    celltype:
      - {column: source_file, match: "Excitatory", label: Exc}
      - {column: source_file, match: "Inhibitory", label: Inh}
      - {column: source_file, match: "Astrocytes", label: Ast}
      - {column: source_file, match: "Oligodendrocytes", label: Oli}
      - {column: source_file, match: "OPCs", label: OPC}
      - {column: cell_type_high_resolution, match: "^Mic", label: Mic}
    covariates:
      # cogdx: 1 no cognitive impairment, 2-3 MCI, 4-5 Alzheimer's dementia, 6 other dementia
      dementia: {column: cogdx, recode: {"1": "no", "2": "no", "3": "no", "4": "yes", "5": "yes", "6": "yes"}}
      sex: {column: msex, recode: {"0": female, "1": male}}
      age: {column: age_death, numeric: true}
    disease: {column: cogdx, recode: {"1": "no", "2": "no", "3": "no", "4": "yes", "5": "yes", "6": "yes"}}
  seaad:
    # The column-mapped copy from run_all_seaad.sh if it exists, else the
    # original download (not column-mapped: it has Subclass, not Celltype)
    counts:
      - data/v2/counts/SeaAD/SEAAD_A9_RNAseq_final-nuclei.2024-02-13.h5ad
      - data/seaAD/PFC/RNAseq/SEAAD_A9_RNAseq_final-nuclei.2024-02-13.h5ad
    layer: UMIs
    gene_map: data/v2/reference/seaad_gene_map.tsv
    donor: Donor ID
    # Subclass; core column-mapping renames it to Celltype (adjust if the copy is used)
    celltype:
      - {column: Subclass, match: "^L[0-9]", label: Exc}
      - {column: Subclass, match: "^(Lamp5|Pax6|Sncg|Vip|Pvalb|Sst|Chandelier)", label: Inh}
      - {column: Subclass, match: "^Astro", label: Ast}
      - {column: Subclass, match: "^Oligo", label: Oli}
      - {column: Subclass, match: "^OPC", label: OPC}
      - {column: Subclass, match: "^Micro", label: Mic}
      - {column: Subclass, match: "^(Endo|VLMC)", label: Vasc}
    covariates:
      dementia: {column: Cognitive Status, recode: {"Dementia": "yes", "No dementia": "no"}}
      sex: {column: Sex, recode: {"Female": female, "Male": male}}
      age: {column: Age at Death, numeric: true}
    disease: {column: Cognitive Status, recode: {"Dementia": "yes", "No dementia": "no"}}

gene_sets:
  seurat_v3_donor_1000: data/v2/processed/rosmap_mit_hvg1000_k30.h5ad
  seurat_v3_donor_2000: data/v2/processed/rosmap_mit_hvg2000_k30.h5ad
  seurat_v3_donor_3000: data/v2/processed/rosmap_mit_hvg3000_k30.h5ad
  seurat_donor_1000: data/v2/processed/rosmap_mit_hvg1000_postnorm_k30.h5ad
  seurat_donor_2000: data/v2/processed/rosmap_mit_hvg2000_postnorm_k30.h5ad
  seurat_donor_3000: data/v2/processed/rosmap_mit_hvg3000_postnorm_k30.h5ad
  seurat_v3_donor_2000_3way: data/v2/processed/rosmap_mit_hvg2000_3way_k30.h5ad
  lieke_hvg: data/v2/processed/rosmap_mit_lieke_hvg_k30.h5ad
  lieke_allgenes_seurat_v3_2000: data/v2/processed/rosmap_mit_lieke_allgenes_hvg2k_k30.h5ad
  lieke_allgenes_seurat_2000: data/v2/processed/rosmap_mit_lieke_allgenes_hvg2k_postnorm_k30.h5ad
  mathys2019_degs: data/v2/processed/rosmap_mit_mathys2019degs_k30.h5ad
