# Protocol effect ROSMAP-MIT (Mathys 2023) vs DiverseCohorts (10x multiome,
# DLPFC) on the ROS and MAP participants in both (same people, so the
# difference is technical), matched on individualID inside the job, as in
# mit_vs_green.yaml. Adds the paired dataset-vs-donor decomposition.
#   sbatch slurm/batch_effects.sh config/batch_effects/mit_vs_diverse_cohorts_shared.yaml
# The covariates of a donor are MIT's (the first dataset); DiverseCohorts'
# are coded the same way.
output_dir: data/v2/batch_effects/mit_vs_diverse_cohorts_shared
max_cells_per_donor: 300
match_donors: true
disease_adjust: [sex, age]

datasets:
  rosmap_mit:
    counts: data/v2/counts/ROSMAP_MIT/combined.h5ad
    gene_map: data/v2/reference/rosmap_mit_gene_map.tsv
    donor: projid
    match_on: individualID
    celltype:
      - {column: source_file, match: "Excitatory", label: Exc}
      - {column: source_file, match: "Inhibitory", label: Inh}
      - {column: source_file, match: "Astrocytes", label: Ast}
      - {column: source_file, match: "Oligodendrocytes", label: Oli}
      - {column: source_file, match: "OPCs", label: OPC}
      - {column: cell_type_high_resolution, match: "^Mic", label: Mic}
    covariates:
      diagnosis: {column: cogdx}
      sex: {column: msex}
      age: {column: age_death, numeric: true}
      braak: {column: braaksc, numeric: true}
      cerad: {column: ceradsc, numeric: true, recode: {"1": 3, "2": 2, "3": 1, "4": 0}}
      apoe4: {column: apoe_genotype, numeric: true, recode: {"22": 0, "23": 0, "33": 0, "24": 1, "34": 1, "44": 2}}
    disease: {column: cogdx, recode: {"1": "no", "2": "no", "3": "no", "4": "yes", "5": "yes", "6": "yes"}}
  diverse_cohorts:
    counts: data/v2/counts/DiverseCohorts/combined.h5ad
    gene_map: data/v2/reference/diverse_cohorts_gene_map.tsv
    donor: individualID
    match_on: individualID
    celltype:
      - {column: broadcellclass, match: "^Glut", label: Exc}
      - {column: broadcellclass, match: "^Gaba", label: Inh}
      - {column: broadcellclass, match: "^Astro", label: Ast}
      - {column: broadcellclass, match: "^Olig", label: Oli}
      - {column: broadcellclass, match: "^Opc", label: OPC}
      - {column: broadcellclass, match: "^Micro", label: Mic}
    covariates:
      diagnosis: {column: cogdx_rush}
      sex: {column: sex, recode: {female: "0", male: "1"}}
      age: {column: ageDeath, numeric: true}
      braak: {column: braak_rush, numeric: true}
      cerad: {column: cerad_rush, numeric: true, recode: {"1": 3, "2": 2, "3": 1, "4": 0}}
      apoe4: {column: apoeGenotype, numeric: true, recode: {"22": 0, "23": 0, "33": 0, "24": 1, "34": 1, "44": 2}}
    disease: {column: cogdx_rush, recode: {"1": "no", "2": "no", "3": "no", "4": "yes", "5": "yes", "6": "yes"}}

# Donor effect (donor_effect.tsv): the share of the donor variation that both
# datasets reproduce, and how much of it the covariates explain
donor_models:
  sex_age: [sex, age]
  sex_age_apoe4: [sex, age, apoe4]
  pathology: [braak, cerad]
  dementia_pathology: [disease, braak, cerad]
  all: [sex, age, apoe4, disease, braak, cerad]

# Genes missing from either dataset are left out of a set (logged)
gene_sets:
  mit_seurat_v3_donor_2000_3way: data/v2/processed/rosmap_mit_hvg2000_3way_k30.h5ad
  mit_seurat_v3_donor_2000: data/v2/processed/rosmap_mit_hvg2000_k30.h5ad
  mit_seurat_donor_2000: data/v2/processed/rosmap_mit_hvg2000_postnorm_k30.h5ad
  green_seurat_v3_donor_2000: data/v2/processed/rosmap_green_hvg2000_k30.h5ad
  green_seurat_donor_2000: data/v2/processed/rosmap_green_hvg2000_postnorm_k30.h5ad
