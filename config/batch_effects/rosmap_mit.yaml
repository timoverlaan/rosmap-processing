# Batch effects within ROSMAP-MIT (Mathys 2023): technical batch vs donor,
# cell type and donor covariates, for every gene set below.
#   sbatch slurm/batch_effects.sh config/batch_effects/rosmap_mit.yaml
# Settings not given here take the defaults in pipelines/batch_effects.py.
output_dir: data/v2/batch_effects/rosmap_mit
max_cells_per_donor: 300

datasets:
  rosmap_mit:
    counts: data/v2/counts/ROSMAP_MIT/combined.h5ad
    gene_map: data/v2/reference/rosmap_mit_gene_map.tsv
    donor: projid
    # Broad cell types; the first matching rule wins, other cells are left out.
    # source_file is the per-class file the cell came from (core combine).
    celltype:
      - {column: source_file, match: "Excitatory", label: Exc}
      - {column: source_file, match: "Inhibitory", label: Inh}
      - {column: source_file, match: "Astrocytes", label: Ast}
      - {column: source_file, match: "Oligodendrocytes", label: Oli}
      - {column: source_file, match: "OPCs", label: OPC}
      # Microglia only: the immune file also holds T cells and CAMs
      - {column: cell_type_high_resolution, match: "^Mic", label: Mic}
    # The count file has no technical batch column (obs summary, Nov 2026):
    # the h5Seurat metadata holds only cell types and the clinical columns.
    batch: []
    covariates:
      study: {column: Study}
      diagnosis: {column: cogdx}
      sex: {column: msex}
      age: {column: age_death, numeric: true}
      pmi: {column: pmi, numeric: true}
      braak: {column: braaksc, numeric: true}
      # CERAD as 0 none - 3 frequent plaques (ceradsc: 1 definite AD - 4 no AD),
      # the direction of SeaAD's; APOE as the number of e4 alleles
      cerad: {column: ceradsc, numeric: true, recode: {"1": 3, "2": 2, "3": 1, "4": 0}}
      apoe4: {column: apoe_genotype, numeric: true, recode: {"22": 0, "23": 0, "33": 0, "24": 1, "34": 1, "44": 2}}
    # Disease signal (disease.tsv): cogdx 1 no cognitive impairment, 2-3 MCI,
    # 4-5 Alzheimer's dementia, 6 other dementia; as in mit_vs_seaad.yaml
    disease: {column: cogdx, recode: {"1": "no", "2": "no", "3": "no", "4": "yes", "5": "yes", "6": "yes"}}
disease_adjust: [sex, age]
# Donor effect (donor_effect.tsv): how much of the variation between donors
# each covariate, the disease, and each of these models explains
donor_models:
  sex_age: [sex, age]
  sex_age_apoe4: [sex, age, apoe4]
  pathology: [braak, cerad]
  dementia_pathology: [disease, braak, cerad]
  all: [sex, age, apoe4, disease, braak, cerad]

# Gene sets: processed files (genes by Ensembl ID) or TXT lists (symbols)
gene_sets:
  seurat_v3_donor_1000: data/v2/processed/rosmap_mit_hvg1000_k30.h5ad
  seurat_v3_donor_2000: data/v2/processed/rosmap_mit_hvg2000_k30.h5ad
  seurat_v3_donor_3000: data/v2/processed/rosmap_mit_hvg3000_k30.h5ad
  seurat_donor_1000: data/v2/processed/rosmap_mit_hvg1000_postnorm_k30.h5ad
  seurat_donor_2000: data/v2/processed/rosmap_mit_hvg2000_postnorm_k30.h5ad
  seurat_donor_3000: data/v2/processed/rosmap_mit_hvg3000_postnorm_k30.h5ad
  seurat_v3_pooled_1000: data/v2/hvg_compare/rosmap_mit/hvg_seurat_v3_pooled_1000.txt
  seurat_v3_pooled_2000: data/v2/hvg_compare/rosmap_mit/hvg_seurat_v3_pooled_2000.txt
  seurat_v3_pooled_3000: data/v2/hvg_compare/rosmap_mit/hvg_seurat_v3_pooled_3000.txt
  seurat_pooled_2000: data/v2/hvg_compare/rosmap_mit/hvg_seurat_pooled_2000.txt
  seurat_v3_donor_2000_3way: data/v2/processed/rosmap_mit_hvg2000_3way_k30.h5ad
  lieke_hvg: data/v2/processed/rosmap_mit_lieke_hvg_k30.h5ad
  lieke_allgenes_seurat_v3_2000: data/v2/processed/rosmap_mit_lieke_allgenes_hvg2k_k30.h5ad
  lieke_allgenes_seurat_2000: data/v2/processed/rosmap_mit_lieke_allgenes_hvg2k_postnorm_k30.h5ad
  mathys2019_degs: data/v2/processed/rosmap_mit_mathys2019degs_k30.h5ad
  april_seurat_v3_pooled_2000: data/processed/rosmap_mit_hvg2000_k30.h5ad
